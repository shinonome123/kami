<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Kami 分享验证</title>
    <link rel="icon" type="image/png" href="/assets/kami-favicon-v2.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="share-shell">
      <header class="share-header">
        <div class="share-brand">
          <img src="/assets/kami-favicon-v2.png" alt="Kami 本地化工作台" />
          <div>
            <p class="eyebrow">KAMI · SHARED REVIEW</p>
            <h1 id="shareTitle">翻译验证</h1>
            <p class="page-description" id="shareMeta">正在读取分享内容……</p>
          </div>
        </div>
        <div class="share-summary" id="shareSummary" hidden></div>
      </header>
      <div class="share-notice">
        <strong>审核说明</strong>
        <span>对照原文逐段检查译文。页面列出的 QA 均为译者已知问题：未勾选表示译者坚持当前译法，不重复上报；如果复核后仍认为必须修改，请勾选对应问题后直接提交，也可以补充新的具体要求或建议译法。</span>
      </div>
      <div class="share-generating" id="shareGeneratingBanner" hidden>
        <strong>辅助拆解生成中</strong>
        <span id="shareGeneratingText">语素拆解与字面直译正在后台生成，页面会自动刷新；您可以先查看原文、译文与评分。</span>
      </div>
      <div class="share-error" id="shareError" role="alert" hidden></div>
      <main class="share-segments" id="shareSegments">
        <div class="empty-list">正在读取分享内容……</div>
      </main>
      <footer class="share-footer">由 Kami 本地化工作台生成 · 数据只读，仅收集审核意见</footer>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="/share.js"></script>
  </body>
</html>
